<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Un tableau de tâches pour apprendre Git." />
    <title>TaskBoard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">Atelier Git</p>
        <div class="title-row">
          <h1>TaskBoard</h1>
          <button id="theme-toggle" class="theme-toggle" type="button">Mode sombre</button>
        </div>
        <p>Une petite application, un historique riche à explorer.</p>
      </header>

      <section class="task-panel" aria-labelledby="tasks-title">
        <div class="panel-heading">
          <h2 id="tasks-title">Mes tâches</h2>
          <span id="task-counter" class="counter">0 tâche</span>
        </div>

        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-title">Nouvelle tâche</label>
          <input
            id="task-title"
            name="title"
            type="text"
            maxlength="80"
            placeholder="Ex. Préparer la démonstration"
            autocomplete="off"
            required
          />
          <button type="submit">Ajouter</button>
        </form>

        <label class="search-box" for="task-search">
          <span>Rechercher</span>
          <input id="task-search" type="search" placeholder="Filtrer les tâches…" />
        </label>

        <p id="empty-state" class="empty-state">Aucune tâche pour le moment.</p>
        <ul id="task-list" class="task-list" aria-live="polite"></ul>
      </section>
    </main>

    <template id="task-template">
      <li class="task-item">
        <button class="toggle-task" type="button" aria-label="Changer l'état"></button>
        <span class="task-label"></span>
        <button class="delete-task" type="button" aria-label="Supprimer la tâche">×</button>
      </li>
    </template>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
